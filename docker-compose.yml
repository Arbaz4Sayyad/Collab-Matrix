version: '3.8'

services:
  # --- Relational Database ---
  postgres:
    image: postgres:15-alpine
    container_name: collab-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: collab_admin
      POSTGRES_PASSWORD: CollabSecurePassword2026!
      POSTGRES_DB: collab_matrix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab_admin -d collab_matrix"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- NoSQL Database ---
  mongodb:
    image: mongo:6.0
    container_name: collab-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: collab_admin
      MONGO_INITDB_ROOT_PASSWORD: CollabMongoPassword2026!
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Cache & Session & WS PubSub ---
  redis:
    image: redis:7.0-alpine
    container_name: collab-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass CollabRedisPassword2026!
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "CollabRedisPassword2026!", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Event Messaging Platform ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: collab-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: collab-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- Observability Stack (Phase 10 Setup) ---
  prometheus:
    image: prom/prometheus:v2.44.0
    container_name: collab-prometheus
    volumes:
      - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:9.5.2
    container_name: collab-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./devops/grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./devops/grafana/provisioning/dashboards/provider.yml:/etc/grafana/provisioning/dashboards/providers/provider.yml
      - ./devops/grafana/provisioning/dashboards/dashboard.json:/var/lib/grafana/dashboards/dashboard.json

  # --- Spring Boot Modular-Monolith Backend ---
  collab-backend:
    build:
      context: ./backend
      dockerfile: ./collab-core/Dockerfile
    container_name: collab-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/collab_matrix
      - SPRING_DATASOURCE_USERNAME=collab_admin
      - SPRING_DATASOURCE_PASSWORD=CollabSecurePassword2026!
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PASSWORD=CollabRedisPassword2026!
      - SPRING_DATA_MONGODB_URI=mongodb://collab_admin:CollabMongoPassword2026!@mongodb:27017/collab_matrix?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092

  # --- High-Performance React Nginx Frontend ---
  collab-frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: collab-frontend
    ports:
      - "8082:80"
    depends_on:
      - collab-backend

volumes:
  pgdata:
  mongodata:
  redisdata:
